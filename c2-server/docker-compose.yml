  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - c2-server
  #   networks:
  #     - rat-network

  # Optional: Redis for session scaling
  # redis:
  #   image: redis:7-alpine
  #   container_name: rat-redis
  #   restart: unless-stopped
