# Project-wide Gradle settings
# IDE (e.g. Android Studio) users: Settings in IDE override these

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration caching
org.gradle.configuration-cache=true

# Enable build caching
org.gradle.caching=true

# Configure on demand
org.gradle.configureondemand=true

# Daemon settings
org.gradle.daemon=true
org.gradle.daemon.idletimeout=300000

# Worker API for annotation processors
kapt.use.worker.api=true

# Android settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true

# Build cache
android.buildCache=true

# R8/ProGuard
android.enableR8.fullMode=true
android.enableR8.libraries=true

# Signing (set via environment variables or GitHub Secrets)
# KEYSTORE_PASSWORD=
# KEY_ALIAS=
# KEY_PASSWORD=

# C2 Configuration (set via environment variables)
# C2_HOST=
# C2_PORT=
# C2_PROTOCOL=