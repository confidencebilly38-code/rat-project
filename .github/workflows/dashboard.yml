name: Dashboard Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'bot/**'
  workflow_dispatch:

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Dashboard
        run: |
          cd dashboard
          npm run build 2>/dev/null || echo "No build script, using static files"

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/public/
          retention-days: 30

  build-bot:
    name: Build Telegram Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Install Bot Dependencies
        run: |
          cd bot
          pip install -r requirements.txt

      - name: Validate Bot Syntax
        run: |
          cd bot
          python3 -m py_compile bot.py

      - name: Upload Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot
          path: bot/
          retention-days: 30

  deploy-codespace:
    name: Update Codespace
    needs: [build-dashboard, build-bot]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Codespace Rebuild
        uses: actions/github-script@v7
        with:
          script: |
            const { Octokit } = require("@octokit/rest");
            const octokit = new Octokit({ auth: process.env.GITHUB_TOKEN });
            
            // Get codespace
            const { data: codespaces } = await octokit.rest.codespaces.listCodespacesForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const codespace = codespaces.codespaces.find(c => c.name.includes("rat-project"));
            if (codespace) {
              await octokit.rest.codespaces.stopCodespaceForAuthenticatedUser({
                codespace_name: codespace.name
              });
              console.log("Codespace stopped, will auto-restart on next access");
            }